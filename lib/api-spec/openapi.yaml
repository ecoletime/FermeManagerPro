openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FermeManager Pro API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: animals
    description: Animal registry
  - name: sante
    description: Health records
  - name: reproduction
    description: Reproduction and births
  - name: alimentation
    description: Feeding and stock
  - name: loges
    description: Buildings and pens
  - name: maintenance
    description: Maintenance tasks
  - name: employes
    description: Employees
  - name: veterinaire
    description: Veterinarian visits
  - name: fournisseurs
    description: Suppliers
  - name: budget
    description: Budget management
  - name: dashboard
    description: Dashboard summary
  - name: notifications
    description: Activity log and notifications
  - name: journal-audit
    description: Audit journal (admin only)
  - name: utilisateurs
    description: User management (admin only)
  - name: system-settings
    description: Global system settings
  - name: auth
    description: Authentication

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── JOURNAL AUDIT ──────────────────────────────────────────────────────────
  /journal-audit:
    get:
      operationId: getJournalAudit
      tags: [journal-audit]
      summary: Get audit journal entries (admin only)
      parameters:
        - in: query
          name: module
          schema:
            type: string
          required: false
        - in: query
          name: utilisateur
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalAuditEntry"

  # ── NOTIFICATIONS ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get all notifications/activity log
      parameters:
        - in: query
          name: module
          schema:
            type: string
          required: false
        - in: query
          name: utilisateur
          schema:
            type: string
          required: false
        - in: query
          name: nonLues
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: createNotification
      tags: [notifications]
      summary: Create a notification/log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/{id}/lue:
    patch:
      operationId: markNotificationLue
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/tout-lire:
    post:
      operationId: markAllNotificationsLues
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  /notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete a notification
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /notifications/stats:
    get:
      operationId: getNotificationsStats
      tags: [notifications]
      summary: Get notification stats (unread count, modules)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonLues:
                    type: integer
                  total:
                    type: integer
                  parModule:
                    type: array
                    items:
                      type: object
                      properties:
                        module:
                          type: string
                        count:
                          type: integer
                      required: [module, count]
                required: [nonLues, total, parModule]

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/alertes:
    get:
      operationId: getDashboardAlertes
      tags: [dashboard]
      summary: Get today's alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alerte"

  /dashboard/activite-recente:
    get:
      operationId: getDashboardActiviteRecente
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiviteItem"

  # ── ANIMAUX ────────────────────────────────────────────────────────────────
  /animaux:
    get:
      operationId: getAnimaux
      tags: [animals]
      summary: List all animals
      parameters:
        - in: query
          name: statut
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
      responses:
        "200":
          description: List of animals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Animal"
    post:
      operationId: createAnimal
      tags: [animals]
      summary: Create a new animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnimalBody"
      responses:
        "201":
          description: Animal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Animal"

  /animaux/{id}:
    get:
      operationId: getAnimal
      tags: [animals]
      summary: Get an animal by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Animal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Animal"
    put:
      operationId: updateAnimal
      tags: [animals]
      summary: Update an animal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnimalBody"
      responses:
        "200":
          description: Updated animal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Animal"
    delete:
      operationId: deleteAnimal
      tags: [animals]
      summary: Delete an animal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /animaux/stats:
    get:
      operationId: getAnimauxStats
      tags: [animals]
      summary: Get animal statistics grouped by type
      responses:
        "200":
          description: Animal stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimauxStats"

  # ── SANTÉ ──────────────────────────────────────────────────────────────────
  /sante/vaccins:
    get:
      operationId: getVaccins
      tags: [sante]
      summary: List all vaccinations
      responses:
        "200":
          description: Vaccinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vaccin"
    post:
      operationId: createVaccin
      tags: [sante]
      summary: Record a vaccination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaccinBody"
      responses:
        "201":
          description: Vaccination recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vaccin"

  /sante/vaccins/{id}:
    delete:
      operationId: deleteVaccin
      tags: [sante]
      summary: Delete a vaccination record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sante/traitements:
    get:
      operationId: getTraitements
      tags: [sante]
      summary: List all treatments
      responses:
        "200":
          description: Treatments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Traitement"
    post:
      operationId: createTraitement
      tags: [sante]
      summary: Record a treatment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraitementBody"
      responses:
        "201":
          description: Treatment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Traitement"

  /sante/quarantaine:
    get:
      operationId: getQuarantaine
      tags: [sante]
      summary: List animals in quarantine
      responses:
        "200":
          description: Quarantine list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quarantaine"
    post:
      operationId: createQuarantaine
      tags: [sante]
      summary: Place an animal in quarantine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuarantaineBody"
      responses:
        "201":
          description: Quarantine recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quarantaine"

  /sante/mortalite:
    get:
      operationId: getMortalite
      tags: [sante]
      summary: List mortality records
      responses:
        "200":
          description: Mortality records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mort"
    post:
      operationId: createMort
      tags: [sante]
      summary: Record a death
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMortBody"
      responses:
        "201":
          description: Death recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mort"

  /sante/stats:
    get:
      operationId: getSanteStats
      tags: [sante]
      summary: Get health statistics
      responses:
        "200":
          description: Health stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanteStats"

