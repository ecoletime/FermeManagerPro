  # ── VÉTÉRINAIRE ────────────────────────────────────────────────────────────
  /veterinaire:
    get:
      operationId: getVisitesVeterinaire
      tags: [veterinaire]
      summary: List veterinarian visits
      responses:
        "200":
          description: Vet visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisiteVeterinaire"
    post:
      operationId: createVisiteVeterinaire
      tags: [veterinaire]
      summary: Schedule/record a vet visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisiteVeterinaireBody"
      responses:
        "201":
          description: Visit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisiteVeterinaire"

  /veterinaire/{id}:
    put:
      operationId: updateVisiteVeterinaire
