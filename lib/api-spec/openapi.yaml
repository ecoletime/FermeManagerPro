              schema:
                $ref: "#/components/schemas/LogesStats"

  # ── MAINTENANCE ────────────────────────────────────────────────────────────
  /maintenance:
    get:
      operationId: getMaintenances
      tags: [maintenance]
      summary: List all maintenance tasks
      parameters:
        - in: query
          name: priorite
          schema:
            type: string
        - in: query
          name: statut
          schema:
            type: string
        - in: query
          name: categorie
          schema:
            type: string
      responses:
        "200":
          description: Maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTask"
    post:
      operationId: createMaintenance
