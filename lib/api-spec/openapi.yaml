  /alimentation/stocks:
    get:
      operationId: getStocks
      tags: [alimentation]
      summary: Get feed stock levels
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"
    post:
      operationId: createStock
      tags: [alimentation]
      summary: Create a new feed stock entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockBody"
      responses:
        "201":
          description: Stock created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"

  /alimentation/stocks/{id}:
    put:
      operationId: updateStock
      tags: [alimentation]
      summary: Update a stock entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockBody"
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
    delete:
      operationId: deleteStock
      tags: [alimentation]
      summary: Delete a stock entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
