      tags: [alimentation]
      summary: Record a feed delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLivraisonBody"
      responses:
        "201":
          description: Delivery recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Livraison"

  /alimentation/stats:
    get:
      operationId: getAlimentationStats
      tags: [alimentation]
      summary: Get feeding statistics
      responses:
        "200":
          description: Feeding stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlimentationStats"

  # ── LOGES ──────────────────────────────────────────────────────────────────
  /loges/batiments:
    get:
      operationId: getBatiments
      tags: [loges]
      summary: List all buildings
      responses:
