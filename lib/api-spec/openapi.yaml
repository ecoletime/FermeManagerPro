    post:
      operationId: createAccouplement
      tags: [reproduction]
      summary: Record a mating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccouplementBody"
      responses:
        "201":
          description: Mating recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accouplement"

  /reproduction/naissances:
    get:
      operationId: getNaissances
