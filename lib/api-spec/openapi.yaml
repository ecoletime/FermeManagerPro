    post:
      operationId: createSevrage
      tags: [reproduction]
      summary: Record a weaning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSevrageBody"
      responses:
        "201":
          description: Weaning recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sevrage"

  /reproduction/stats:
    get:
      operationId: getReproductionStats
      tags: [reproduction]
      summary: Get reproduction statistics
      responses:
        "200":
          description: Reproduction stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReproductionStats"

  # ── ALIMENTATION ───────────────────────────────────────────────────────────
  /alimentation/repas:
    get:
      operationId: getRepas
      tags: [alimentation]
      summary: List meal records
      responses:
        "200":
          description: Meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repas"
    post:
      operationId: createRepas
      tags: [alimentation]
      summary: Record a meal distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepasBody"
      responses:
